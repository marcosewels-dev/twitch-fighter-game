<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Twitch Chat Arena - Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent; /* Transparente para OBS */
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }
    #game-container {
      position: relative;
      width: 1280px;
      height: 720px;
      background-color: transparent;
    }
    canvas {
      display: block;
    }
    #btn-test {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 100;
      padding: 8px 16px;
      background-color: #9146ff; /* Color Twitch */
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    #btn-test:hover {
      background-color: #772ce8;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!--<button id="btn-test">Simular Pelea</button>-->
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
