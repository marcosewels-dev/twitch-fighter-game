<!doctype html>
<html lang="es">

<head>
	<meta charset="UTF-8" />
	<title>Twitch Chat Arena</title>
	<style>
		body {
			margin: 0;
			background-color: transparent;
			/* Transparente para que funcione como overlay en OBS */
			overflow: hidden;
			font-family: "Arial", sans-serif;
		}

		#game-container {
			position: relative;
			width: 1280px;
			height: 720px;
			background-color: transparent;
		}

		canvas {
			display: block;
		}

		#hud {
			position: absolute;
			top: 10px;
			left: 10px;
			color: white;
			font-size: 16px;
			text-shadow: 2px 2px 4px #000;
			z-index: 10;
		}

		/* 🧪 ESTILOS DE LA SUITE DE INTEGRACIÓN FLOTANTE (Solo para desarrollo) */
		#test-panel {
			position: absolute;
			top: 15px;
			right: 15px;
			/* Lo ponemos a la derecha para que no pise tu HUD de la izquierda */
			width: 340px;
			max-height: 90vh;
			background: rgba(15, 15, 20, 0.95);
			color: #ffffff;
			border: 2px solid #2ecc71;
			padding: 18px;
			box-sizing: border-box;
			display: none;
			/* Se activa dinámicamente con ?test=true */
			flex-direction: column;
			gap: 12px;
			border-radius: 8px;
			font-size: 13px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
			overflow-y: auto;
			z-index: 9999;
		}

		.btn-test-action {
			color: #fff;
			border: none;
			padding: 10px;
			cursor: pointer;
			border-radius: 4px;
			font-weight: bold;
			transition: background 0.2s;
		}
	</style>
</head>

<body>
	<div id="game-container">

		<canvas id="gameCanvas" width="1280" height="720"></canvas>

		<div id="test-panel">
			<h3 style="margin: 0 0 5px 0; color: #2ecc71;">🔬 Consola de Comandos E2E</h3>
			<p style="margin: 0; color: #aaaaaa; font-size: 11px;">
				Escribe cualquier comando como si fueras un espectador en Twitch.
			</p>

			<hr style="border: 0; border-top: 1px solid #333; margin: 4px 0;">

			<div style="display: flex; gap: 8px; align-items: center;">
				<label style="white-space: nowrap;"><b>Usuario:</b></label>
				<input type="text" id="test-user-name" value="ViewerPro" style="
                        flex: 1; background: #222; color: #fff; border: 1px solid #555; 
                        padding: 4px 6px; border-radius: 4px; font-weight: bold;
                    ">
			</div>

			<div style="display: flex; gap: 4px; margin-top: 5px;">
				<input type="text" id="test-chat-input" placeholder="Ej: !luchar mago" style="
                        flex: 1; background: #111; color: #00ff66; border: 1px solid #2ecc71; 
                        padding: 6px; border-radius: 4px; font-family: monospace;
                    ">
				<button id="btn-enviar-comando"
					style="background: #2ecc71; border: none; padding: 0 12px; border-radius: 4px; color: white; cursor: pointer; font-weight: bold;">➡️</button>
			</div>

			<hr style="border: 0; border-top: 1px solid #333; margin: 4px 0;">

			<label><b>⚡ Macros de Comando Rápidos:</b></label>
			<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px;">
				<button class="btn-macro" data-cmd="!luchar guerrero"
					style="background: #34495e; color: white; border: none; padding: 6px; cursor: pointer; border-radius: 4px; font-size: 11px;">🛡️
					!luchar guerrero</button>
				<button class="btn-macro" data-cmd="!luchar ninja"
					style="background: #34495e; color: white; border: none; padding: 6px; cursor: pointer; border-radius: 4px; font-size: 11px;">🥷
					!luchar ninja</button>
				<button class="btn-macro" data-cmd="!luchar mago"
					style="background: #34495e; color: white; border: none; padding: 6px; cursor: pointer; border-radius: 4px; font-size: 11px;">🧙
					!luchar mago</button>
				<button class="btn-macro" data-cmd="!dungeon"
					style="background: #8e44ad; color: white; border: none; padding: 6px; cursor: pointer; border-radius: 4px; font-size: 11px;">🏰
					!dungeon (Abrir)</button>
				<button class="btn-macro" data-cmd="!entrar"
					style="background: #27ae60; color: white; border: none; padding: 6px; cursor: pointer; border-radius: 4px; font-size: 11px;">🚪
					!entrar (Raid)</button>
				<button class="btn-macro" data-cmd="!apostar rojo 50"
					style="background: #c0392b; color: white; border: none; padding: 6px; cursor: pointer; border-radius: 4px; font-size: 11px;">🪙
					!apostar rojo 50</button>
			</div>

			<div
				style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px; background: #1a1a24; padding: 6px; border-radius: 4px;">
				<span style="font-size: 11px;">Bots masivos:</span>
				<input type="number" id="test-players-count" value="6" min="1" max="6"
					style="width: 40px; background: #222; color: #fff; border: 1px solid #555; text-align: center;">
				<button id="btn-simular-cola"
					style="background: #27ae60; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold;">⚔️
					Forzar</button>
			</div>

			<hr style="border: 0; border-top: 1px solid #333; margin: 4px 0;">

			<label><b>📡 Trazas de Extracción de Datos:</b></label>
			<div id="test-log" style="
                    background: #0a0a0f; border: 1px solid #333; height: 160px; 
                    overflow-y: auto; padding: 8px; font-family: 'Courier New', monospace; 
                    font-size: 11px; color: #00ff66; border-radius: 4px; box-sizing: border-box;
                    line-height: 1.4; margin-top: 4px;
                ">
				<div>[SISTEMA] Consola híbrida lista.</div>
			</div>
		</div>
	</div>

	<script type="module" src="/src/main.ts"></script>
</body>

</html>
